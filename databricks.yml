bundle:
  name: autonomous-market-intelligence-engine

variables:
  workspace_host:
    description: Databricks workspace URL (no credentials)
  spark_version:
    description: Runtime compatible with the workspace
    default: 14.3.x-scala2.12
  node_type_id:
    description: Worker node type available in the workspace
    default: m5d.large
  catalog:
    default: main
  schema:
    default: market_intelligence

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: ${var.workspace_host}

resources:
  jobs:
    market_intelligence_pipeline:
      name: AMI Engine ETL and Vector Index Sync
      max_concurrent_runs: 1
      job_clusters:
        - job_cluster_key: ami_etl_cluster
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: ${var.node_type_id}
            num_workers: 1
            data_security_mode: SINGLE_USER
            single_user_name: ${workspace.current_user.userName}
            spark_env_vars:
              DATABRICKS_CATALOG: ${var.catalog}
              DATABRICKS_SCHEMA: ${var.schema}
              DATABRICKS_BRONZE_TABLE: ${var.catalog}.${var.schema}.bronze_market_feeds
              DATABRICKS_SOURCE_TABLE: ${var.catalog}.${var.schema}.silver_market_chunks
              DATABRICKS_GOLD_TABLE: ${var.catalog}.${var.schema}.gold_market_summary
              DATABRICKS_VECTOR_SEARCH_PRIMARY_KEY: feed_id
              DATABRICKS_VECTOR_SEARCH_ENDPOINT: market_intelligence_vs_endpoint
              DATABRICKS_VECTOR_SEARCH_INDEX: ${var.catalog}.${var.schema}.silver_market_chunks_vector_index
              DATABRICKS_LLM_PROVIDER: ollama
      tasks:
        - task_key: silver_and_gold_etl
          job_cluster_key: ami_etl_cluster
          spark_python_task:
            python_file: src/etl/silver_ingestion.py
        - task_key: sync_vector_index
          depends_on:
            - task_key: silver_and_gold_etl
          job_cluster_key: ami_etl_cluster
          libraries:
            - pypi:
                package: databricks-ai-search==0.78
            - pypi:
                package: databricks-sdk==0.94.0
          spark_python_task:
            python_file: src/indexers/vector_search_sync.py
