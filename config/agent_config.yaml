# ==============================================================================
# Autonomous Market Intelligence Engine - Agent & Pipeline Configuration
# ==============================================================================

global:
  app_name: "Autonomous Market Intelligence Engine"
  environment: "production"
  default_provider: "openai"
  default_model: "gpt-4o"
  temperature: 0.1
  max_iterations: 3  # Maps to GlobalMarketState.iteration_count limit

supervisor:
  model: "gpt-4o"
  temperature: 0.0
  max_iterations: 3
  allowed_nodes:
    - "retriever"
    - "analyzer"
    - "synthesizer"
    - "guardrails"
    - "__end__"

retriever:
  model: "gpt-4o-mini"
  temperature: 0.0
  top_k: 5
  search_type: "hybrid"  # Databricks Vector Search hybrid mode
  vector_search_endpoint: "market_intelligence_vs_endpoint"
  index_name: "main.market_db.market_chunks_index"
  score_threshold: 0.70

analyzer:
  model: "gpt-4o"
  temperature: 0.2
  confidence_threshold: 0.85  # Evaluated against GlobalMarketState.confidence_score
  min_contexts_required: 2

synthesizer:
  model: "gpt-4o"
  temperature: 0.3
  enforce_citations: true
  output_format: "markdown"

guardrails:
  enabled: true
  config_path: "config/guardrails"  # Path to NeMo .colang definition files
  fallback_status: "NEEDS_RETRY"    # Sets GlobalMarketState.status on failure
  max_retry_attempts: 2

evaluation:
  mlflow_experiment_name: "/Market_Intelligence_Agent_Tracing"
  golden_dataset_path: "data/gold_eval_dataset.json"
  target_thresholds:
    faithfulness: 0.90
    answer_relevance: 0.90
    context_precision: 0.90
    context_recall: 0.85
    p95_latency_sec: 3.0