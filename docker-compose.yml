services:
  mlflow:
    image: python:3.12-slim
    command:
      - sh
      - -c
      - >-
        pip install --no-cache-dir mlflow==3.15.1 &&
        mlflow server --backend-store-uri sqlite:////mlflow/mlflow.db
        --default-artifact-root /mlflow/artifacts --host 0.0.0.0 --port 5000
        --allowed-hosts mlflow,localhost,127.0.0.1
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  evaluation:
    profiles: [evaluation]
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    depends_on:
      mlflow:
        condition: service_healthy
    command: ["python", "-m", "main", "--limit", "1"]

volumes:
  mlflow-data:
